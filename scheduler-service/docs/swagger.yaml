basePath: /api
definitions:
  jobs.CreateJobsPayload:
    properties:
      config:
        type: string
      is_recurring_job:
        type: boolean
      name:
        type: string
      should_retry_after_backoff:
        type: boolean
      trigger_time:
        type: string
      type:
        type: string
    required:
    - config
    - is_recurring_job
    - name
    - should_retry_after_backoff
    - trigger_time
    - type
    type: object
host: localhost:8081
info:
  contact: {}
  description: API for scheduler, image and worker spawning
  title: Job Scheduler API
  version: "1.0"
paths:
  /GetByTypeAndVersion:
    get:
      description: Writes and reads a test key from Redis
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get's image information
      tags:
      - system
  /healthCheck:
    delete:
      consumes:
      - application/json
      description: For a given worker
      parameters:
      - description: Worker Id
        in: query
        name: workerId
        required: true
        type: string
      - description: Job Execution id
        in: query
        minimum: 1
        name: jobExecutionId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Performs worker health checks
      tags:
      - HealthCheck
    get:
      consumes:
      - application/json
      description: For a given worker
      parameters:
      - description: Worker Id
        in: query
        name: workerId
        required: true
        type: string
      - description: Job Execution id
        in: query
        minimum: 1
        name: jobExecutionId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Performs worker health checks
      tags:
      - HealthCheck
  /hello:
    get:
      description: Simple hello endpoint
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health check
      tags:
      - system
  /helloRedis:
    get:
      description: Writes and reads a test key from Redis
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Test Redis connection - TEMP
      tags:
      - system
  /jobs/create:
    post:
      consumes:
      - application/json
      description: Creates multiple jobs in a single request (bulk create)
      parameters:
      - description: List of jobs to create
        in: body
        name: jobs
        required: true
        schema:
          items:
            $ref: '#/definitions/jobs.CreateJobsPayload'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Jobs created successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create multiple jobs
      tags:
      - jobs
  /worker/spawnWorker:
    get:
      consumes:
      - application/json
      description: Spawns the given number of worker pods in the cluster
      parameters:
      - description: Number of workers to spawn
        in: query
        minimum: 1
        name: noOfWorkers
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Pods spawned successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Spawn worker pods
      tags:
      - worker
swagger: "2.0"
