name: Worker Docker CI/CD

on:
  pull_request:
    branches:
      - master
      - release/*
    paths:
      - "worker-service/**"

  push:
    branches:
      - master
    paths:
      - "worker-service/**"

jobs:
  worker-dockerg:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PR build (validate)
      - name: Build image (PR validation)
        if: github.event_name == 'pull_request'
        run: |
          docker build \
            -f worker-service/Dockerfile \
            .

      # Login for push
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build + tag for push
      - name: Build & Tag image
        if: github.event_name == 'push'
        run: |
          docker build \
            -f worker-service/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/worker-service:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/worker-service:${{ github.sha }} \
            .

      # Push on push
      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/worker-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/worker-service:${{ github.sha }}
